app = "codeclash"       # change if this name is taken on Fly.io
primary_region = "sin"  # change to your closest region (run: fly platform regions)

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
